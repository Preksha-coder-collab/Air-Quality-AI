<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Health Advisor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">AirQuality AI</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/about">About</a>
                <a class="nav-link active" href="/sustainability">Sustainability</a>
                <a class="nav-link" href="/prediction">Prediction</a>
                <a class="nav-link" href="/visualization">Visualization</a>
            </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <h1 class="text-center fw-bold mb-4 health-title">
            🩺 Health Advisor
        </h1>

        <!-- AQI Display -->
        <div class="alert text-center aqi-box">
            <h4>Current AQI</h4>
            <h2>{{ current_aqi }}</h2>
        </div>

        <!-- Disease Buttons -->
        <div class="text-center mb-4">

            {% for disease in diseases.keys() %}

            <button
                class="btn btn-primary health-btn"
                onclick="showAdvice('{{ disease }}')">

                {{ disease }}

            </button>

            {% endfor %}

        </div>

        <!-- Result Card -->
        <div id="result" class="card health-card p-4">

            <h4 class="text-center">
                Select a disease type to view health tips and precautions.
            </h4>

        </div>

    </div>

    <script type="application/json" id="health-data">
{{ diseases | tojson }}
</script>

<script>

const healthData = JSON.parse(
    document.getElementById("health-data").textContent
);

function showAdvice(disease){

     const data = healthData[disease];

    document.getElementById("result").innerHTML = `
        <h2 class="text-center mb-4">${disease}</h2>

        <h4>💡 Health Tips</h4>
        <ul id="tipsList"></ul>

        <h4 class="mt-4">⚠️ Precautions</h4>
        <ul id="precautionsList"></ul>
    `;

    const tipsList = document.getElementById("tipsList");
    const precautionsList = document.getElementById("precautionsList");

    let delay = 0;

    data.tips.forEach((tip) => {

        setTimeout(() => {

            const li = document.createElement("li");
            li.className = "fade-in-item";
            li.textContent = tip;

            tipsList.appendChild(li);

        }, delay);

        delay += 800;

    });

    data.precautions.forEach((precaution) => {

        setTimeout(() => {

            const li = document.createElement("li");
            li.className = "fade-in-item";
            li.textContent = precaution;

            precautionsList.appendChild(li);

        }, delay);

        delay += 800;

    });

}

</script>

</body>

</html>
